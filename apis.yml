    url: mcp/sigma-computing-mcp.yml
  - type: ToolCrosswalk
    url: mcp/sigma-computing-tool-crosswalk.yml
  - type: Documentation
    url: https://help.sigmacomputing.com/docs/use-sigma-mcp-server
- name: Sigma Embed API
  description: >-
    Secure embedding of Sigma workbooks, pages and individual elements into a host application. Embed URLs are signed
    with JSON Web Tokens carrying the viewing user's identity, team and user attributes so row-level and column-level
    security follow the end user into the embed. Driven from the browser with the @sigmacomputing/embed-sdk and
    @sigmacomputing/react-embed-sdk packages.
  humanURL: https://help.sigmacomputing.com/docs/create-an-embed-api-with-json-web-tokens
  baseURL: https://app.sigmacomputing.com
