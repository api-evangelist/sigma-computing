- name: Sigma MCP Server
  description: >-
    Sigma's first-party remote Model Context Protocol server. AI assistants such as Claude, ChatGPT, Codex, Cursor
    and Snowflake Cortex Code connect over HTTP with OAuth and can then search a Sigma organization for workbooks,
    data models, reports and warehouse tables, describe their columns and semantics, and run governed queries in
    natural language. Permissions are inherited from the caller's own Sigma account rather than a service identity,
    and MCP-issued warehouse queries are tagged "kind":"mcp" so their cost can be attributed.
  humanURL: https://help.sigmacomputing.com/docs/use-sigma-mcp-server
  baseURL: https://api.sigmacomputing.com/mcp
  tags:
  - MCP
  - AI Agents
  - Analytics
  tags_raw:
  - mcp
  - ai-agents
  - analytics
