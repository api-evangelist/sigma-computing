aid: sigma-computing
name: Sigma Computing
description: >-
  Sigma Computing is a warehouse-first analytics and business-application platform. Instead of extracting data into
  its own store, Sigma queries the customer's cloud data warehouse live — Snowflake, Databricks, BigQuery, Redshift,
  Amazon Athena, PostgreSQL and ClickHouse — and puts a spreadsheet-style interface, governed data models, input
  tables with write-back, pixel-perfect paginated reports, embedded white-label analytics and AI agents on top of it.
  The developer surface is a 274-operation REST API (OpenAPI 3.1) covering workbooks, data models, reports,
  connections, members, teams, workspaces, permissions, user attributes, tenants, templates and API connectors;
  a first-party Rust CLI generated from that same OpenAPI; a remote OAuth-protected MCP server that lets AI
  assistants search, describe and query governed data in natural language; JavaScript embed and plugin SDKs; and
  three Apache-2.0 agent skills Sigma publishes for Claude Code, Cursor, Codex and Snowflake Cortex Code.
