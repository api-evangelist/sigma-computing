apis:
- name: Sigma MCP Server
  description: >-
    Sigma's first-party remote Model Context Protocol server. AI assistants such as Claude, ChatGPT, Codex,
    Cursor and Snowflake Cortex Code connect over HTTP with OAuth and can then search a Sigma organization
    for workbooks, data models, reports and warehouse tables, describe their columns and semantics, and
    run governed queries in natural language. Permissions are inherited from the caller's own Sigma account
    rather than a service identity, and MCP-issued warehouse queries are tagged "kind":"mcp" so their
    cost can be attributed.
  humanURL: https://help.sigmacomputing.com/docs/use-sigma-mcp-server
  baseURL: https://api.sigmacomputing.com/mcp
  tags:
  - MCP
  - AI Agents
  - Analytics
  tags_raw:
  - mcp
  - ai-agents
  - analytics
  properties:
  - type: MCPServer
    url: mcp/sigma-computing-mcp.yml
  - type: ToolCrosswalk
    url: mcp/sigma-computing-tool-crosswalk.yml
  - type: Documentation
    url: https://help.sigmacomputing.com/docs/use-sigma-mcp-server
- name: Sigma Embed API
  description: >-
    Secure embedding of Sigma workbooks, pages and individual elements into a host application. Embed
    URLs are signed with JSON Web Tokens carrying the viewing user's identity, team and user attributes
    so row-level and column-level security follow the end user into the embed. Driven from the browser
    with the @sigmacomputing/embed-sdk and @sigmacomputing/react-embed-sdk packages.
  humanURL: https://help.sigmacomputing.com/docs/create-an-embed-api-with-json-web-tokens
  baseURL: https://app.sigmacomputing.com
