apis:
- name: Sigma REST API
  description: >-
    The Sigma REST API provides programmatic access to a Sigma organization over HTTP — connections, datasets, data
    models, workbooks, reports, teams, members, workspaces, grants, tags, templates, tenants, user attributes, SAML
    configuration, allowed IPs, API connectors and credentials. Resource-oriented URLs, JSON request and response
    bodies, HTTP status codes for errors, and CORS support. Authentication is OAuth 2.0 client credentials exchanged
    at /v2/auth/token for a bearer token that expires after one hour. The base URL is region-specific: Sigma runs
    thirteen documented hosts across GCP, AWS and Azure and each organization uses exactly one.
  humanURL: https://help.sigmacomputing.com/reference/get-started-sigma-api
  baseURL: https://api.sigmacomputing.com
