summary: Sigma's object graph is a governed document store over a customer warehouse. Files (inodes) are the filesystem
  spine; workbooks, data models, reports and datasets are documents inside it; grants attach access to documents, folders
  and connections; members, teams and user attributes carry identity and row-level context; connections bind everything
  to the warehouse.
