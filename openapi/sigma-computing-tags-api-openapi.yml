  /v2/tags/{tagId}:
    delete:
      summary: Delete a tag
      description: Delete a specific version tag. Retrieve the **tagId** by calling the [/v2/tags](https://help.sigmacomputing.com/reference/list-version-tag) endpoint and using the `versionTagId` in the response.
      parameters:
      - name: tagId
        schema:
          type: string
        in: path
        required: true
      operationId: deleteVersionTag
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - tags
      security:
      - oauth2: []
    patch:
      summary: Update a tag
      description: Update the description of a specific version tag. Retrieve the **tagId** by calling the [/v2/tags](https://help.sigmacomputing.com/reference/list-version-tag) endpoint and using the `versionTagId` in the response.
      parameters:
      - name: tagId
        schema:
          type: string
        in: path
        required: true
      operationId: updateVersionTag
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Description of the version tag.
              description: Update version tag request
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - versionTagId
                  - name
                  - ownerId
                  properties:
                    versionTagId:
                      type: string
                    name:
                      type: string
                    ownerId:
                      type: string
                - type: object
                  required:
                  - createdBy
                  - updatedBy
                  - createdAt
                  - updatedAt
                  properties:
                    createdBy:
                      type: string
                      description: The identifier of the user who created this object.
                    updatedBy:
                      type: string
                      description: The identifier of the user or process that last updated this object.
                    createdAt:
                      type: string
                      format: date-time
                      description: When the object was created.
                    updatedAt:
                      type: string
                      format: date-time
                      description: When the object was last updated.
                - type: object
                  properties:
                    isArchived:
                      type: boolean
                    description:
                      type: string
                    color:
                      type: string
                      enum:
                      - cyan
                      - grass
                      - violet
                      - plum
                      - amber
                      - bronze
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - tags
      security:
      - oauth2: []
