tags:
- name: tags
paths:
  /v2/tags:
    post:
      summary: Create a tag
      description: Create a version tag to use, for example, for workbooks.
      parameters: []
      operationId: createVersionTag
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - name
                - color
                properties:
                  name:
                    type: string
                    description: Name of the tag. Must be unique
                  color:
                    type: string
                    enum:
                    - cyan
                    - grass
                    - violet
                    - plum
                    - amber
                    - bronze
                    description: Color to associate with the tag in Sigma
              - type: object
                properties:
                  description:
                    type: string
                    description: Description for the tag
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - versionTagId
                properties:
                  name:
                    type: string
                  versionTagId:
                    type: string
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - tags
      security:
      - oauth2: []
    get:
      summary: Get tags
      description: Get a list of version tags.
      parameters:
      - name: page
        schema:
          type: string
          description: Use to specify further pages using the string returned in the nextPage portion of the response.
          title: Page
        in: query
      - name: limit
        schema:
          type: number
          description: Number of results to return per page, with a maximum of 1,000 per request. Use the `page` option in subsequent requests to retrieve the next set of results.
          title: Limit
        in: query
      - name: search
        schema:
          type: string
          description: Search query
        in: query
      operationId: listVersionTag
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  - nextPage
                  properties:
                    entries:
                      type: array
                      items:
                        allOf:
                        - type: object
                          required:
                          - versionTagId
                          - name
                          - ownerId
                          properties:
                            versionTagId:
                              type: string
                            name:
                              type: string
                            ownerId:
                              type: string
                        - type: object
                          required:
                          - createdBy
                          - updatedBy
                          - createdAt
                          - updatedAt
                          properties:
                            createdBy:
                              type: string
                              description: The identifier of the user who created this object.
                            updatedBy:
                              type: string
                              description: The identifier of the user or process that last updated this object.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the object was created.
                            updatedAt:
                              type: string
                              format: date-time
                              description: When the object was last updated.
                        - type: object
                          properties:
                            isArchived:
                              type: boolean
                            description:
                              type: string
                            color:
                              type: string
                              enum:
                              - cyan
                              - grass
                              - violet
                              - plum
                              - amber
                              - bronze
                      description: Array of results returned by the endpoint
                    nextPage:
                      type:
                      - string
                      - 'null'
                      description: Returns a string that can be used as the `page` parameter in the next request to fetch the next page of results. The last page of results returns `null`.
                - type: object
                  properties:
                    total:
                      type: number
                      description: Total number of results. Useful to determine if there is a need to paginate.
                    hasMore:
                      type: boolean
                      description: '**[Deprecated]** Indicates whether more results are available.'
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - tags
      security:
      - oauth2: []
