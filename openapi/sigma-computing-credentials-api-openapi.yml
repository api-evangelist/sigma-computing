components:
  responses:
    ApiError:
      description: Sigma API Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              code:
                type: string
              requestId:
                type: string
  schemas:
    credentials_createCredentials_Response_200:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
      required:
      - clientId
      - clientSecret
      title: credentials_createCredentials_Response_200
    credentials_deleteCredentials_Response_200:
      type: object
      properties: {}
      title: credentials_deleteCredentials_Response_200
    V2CredentialsPostRequestBodyContentApplicationJsonSchemaScopesItems:
      type: string
      enum:
      - api
      - embed
      title: V2CredentialsPostRequestBodyContentApplicationJsonSchemaScopesItems
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v2/auth/token
          refreshUrl: /v2/auth/token
          scopes: {}
    OAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 authentication
