info:
  title: Sigma Computing Credentials API
  version: '1.0'
  description: 'Operations tagged credentials across 2 of this provider''s published API definitions: sigma-computing-public-rest-api-openapi.json, sigma-computing-rest-api-openapi.yaml. Each path carries the servers of the definition it was published in.'
