  /v2/plugins/{pluginId}:
    get:
      summary: Get a custom plugin (Beta)
      description: 'Get the metadata for a custom plugin by ID.


        **Beta**: This documentation describes a private beta feature and is subject to the [Beta features](/docs/sigma-product-releases#beta-features) disclaimer.


        ### Usage notes

        - Retrieve the **pluginId** by calling the [/v2/plugins](https://help.sigmacomputing.com/reference/list-custom-plugins) endpoint.'
      parameters:
      - name: pluginId
        schema:
          type: string
          description: Unique identifier (UUID) of the custom plugin.
        in: path
        required: true
      operationId: getCustomPlugin
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - pluginId
                - name
                - description
                - url
                - devUrl
                - type
                properties:
                  pluginId:
                    type: string
                    description: Unique identifier (UUID) of the custom plugin.
                  name:
                    type: string
                    description: Display name of the custom plugin.
                  description:
                    type:
                    - string
                    - 'null'
                    description: Description of the custom plugin.
                  url:
                    type: string
                    description: Production URL where the plugin is hosted. Sigma loads the plugin from this URL when it is added to a workbook. An empty string indicates that no production URL has been set for the plugin yet.
                  devUrl:
                    type:
                    - string
                    - 'null'
                    description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode.
                  type:
                    type: string
                    enum:
                    - element
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - plugins
      security:
      - oauth2: []
    patch:
      summary: Update a custom plugin (Beta)
      description: 'Update metadata fields on an existing custom plugin. Only fields included in the request are changed. The `url` field cannot be updated by this endpoint.


        **Beta**: This documentation describes a private beta feature and is subject to the [Beta features](/docs/sigma-product-releases#beta-features) disclaimer.


        ### Usage notes

        - Retrieve the **pluginId** by calling the [/v2/plugins](https://help.sigmacomputing.com/reference/list-custom-plugins) endpoint.

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type or an account type with the **Manage plugins** permission enabled.'
      parameters:
      - name: pluginId
        schema:
          type: string
          description: Unique identifier (UUID) of the custom plugin.
        in: path
        required: true
      operationId: updateCustomPlugin
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name of the custom plugin.
                description:
                  type:
                  - string
                  - 'null'
                  description: Description of the custom plugin.
                devUrl:
                  type:
                  - string
                  - 'null'
                  description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode.
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - pluginId
                - name
                - description
                - url
                - devUrl
                - type
                properties:
                  pluginId:
                    type: string
                    description: Unique identifier (UUID) of the custom plugin.
                  name:
                    type: string
                    description: Display name of the custom plugin.
                  description:
                    type:
                    - string
                    - 'null'
                    description: Description of the custom plugin.
                  url:
                    type: string
                    description: Production URL where the plugin is hosted. Sigma loads the plugin from this URL when it is added to a workbook. An empty string indicates that no production URL has been set for the plugin yet.
                  devUrl:
                    type:
                    - string
                    - 'null'
                    description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode.
                  type:
                    type: string
                    enum:
                    - element
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - plugins
      security:
      - oauth2: []
    delete:
      summary: Delete a custom plugin (Beta)
      description: 'Permanently delete a custom plugin. Workbook elements that reference the deleted plugin remain in their workbooks but can no longer render plugin content.


        **Beta**: This documentation describes a private beta feature and is subject to the [Beta features](/docs/sigma-product-releases#beta-features) disclaimer.


        ### Usage notes

        - Retrieve the **pluginId** by calling the [/v2/plugins](https://help.sigmacomputing.com/reference/list-custom-plugins) endpoint.

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type or an account type with the **Manage plugins** permission enabled.'
      parameters:
      - name: pluginId
        schema:
          type: string
          description: Unique identifier (UUID) of the custom plugin.
        in: path
        required: true
      operationId: deleteCustomPlugin
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - plugins
      security:
      - oauth2: []
