tags:
- name: plugins
paths:
  /v2/plugins:
    get:
      summary: List custom plugins (Beta)
      description: 'List custom plugins owned by the current organization.


        **Beta**: This documentation describes a private beta feature and is subject to the [Beta features](/docs/sigma-product-releases#beta-features) disclaimer.'
      parameters:
      - name: pageToken
        schema:
          type: string
          description: Use to specify the next set of results with the string returned in the `nextPageToken` field of the previous response.
          title: Page token
        in: query
      - name: pageSize
        schema:
          type: integer
          description: Number of results to return per page, with a maximum of 1000. Defaults to 100.
          title: Page size
        in: query
      operationId: listCustomPlugins
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  properties:
                    entries:
                      type: array
                      items:
                        type: object
                        required:
                        - pluginId
                        - name
                        - description
                        - url
                        - devUrl
                        - type
                        properties:
                          pluginId:
                            type: string
                            description: Unique identifier (UUID) of the custom plugin.
                          name:
                            type: string
                            description: Display name of the custom plugin.
                          description:
                            type:
                            - string
                            - 'null'
                            description: Description of the custom plugin.
                          url:
                            type: string
                            description: Production URL where the plugin is hosted. Sigma loads the plugin from this URL when it is added to a workbook. An empty string indicates that no production URL has been set for the plugin yet.
                          devUrl:
                            type:
                            - string
                            - 'null'
                            description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode.
                          type:
                            type: string
                            enum:
                            - element
                      description: Array of results returned by the endpoint
                      title: Result entries
                - type: object
                  properties:
                    nextPageToken:
                      type: string
                      description: 'A string that can be passed to the `pageToken` parameter in the next request to fetch the next page of results. Not present in the last page of results.

                        **Must be treated as an opaque string.**'
                      title: Next page token
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - plugins
      security:
      - oauth2: []
    post:
      summary: Create a custom plugin (Beta)
      description: 'Register a new custom plugin in the organization. If `url` is omitted, the plugin is created with an empty production URL, and Sigma cannot load the plugin in workbooks until one is set.


        **Beta**: This documentation describes a private beta feature and is subject to the [Beta features](/docs/sigma-product-releases#beta-features) disclaimer.


        ### Usage notes

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type or an account type with the **Manage plugins** permission enabled.'
      parameters: []
      operationId: createCustomPlugin
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Display name of the custom plugin.
              - type: object
                properties:
                  description:
                    type:
                    - string
                    - 'null'
                    description: Description of the custom plugin.
                  devUrl:
                    type:
                    - string
                    - 'null'
                    description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode. Defaults to `http://localhost:5173` if omitted.
                  url:
                    type: string
                    description: Production URL where the plugin is hosted. Sigma loads the plugin from this URL when it is added to a workbook. If omitted, the plugin is created with an empty URL.
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - pluginId
                - name
                - description
                - url
                - devUrl
                - type
                properties:
                  pluginId:
                    type: string
                    description: Unique identifier (UUID) of the custom plugin.
                  name:
                    type: string
                    description: Display name of the custom plugin.
                  description:
                    type:
                    - string
                    - 'null'
                    description: Description of the custom plugin.
                  url:
                    type: string
                    description: Production URL where the plugin is hosted. Sigma loads the plugin from this URL when it is added to a workbook. An empty string indicates that no production URL has been set for the plugin yet.
                  devUrl:
                    type:
                    - string
                    - 'null'
                    description: Development URL for the plugin. Sigma loads the plugin from this URL when the plugin runs in development mode.
                  type:
                    type: string
                    enum:
                    - element
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - plugins
      security:
      - oauth2: []
