tags:
- name: Account Types
paths:
  /v2/accountTypes:
    get:
      summary: List account types
      description: 'Returns a list of all account types available in the organization.


        ### Usage notes

        - Use the **accountTypeId** with the /v2/accountTypes/:accountTypeId/permissions endpoint to retrieve more detailed permissions.

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type.


        ### Usage scenarios

        - Display available account types in an admin interface.

        - Show an overview of account types for management.'
      parameters:
      - name: pageToken
        schema:
          type: string
          description: Use to specify the next set of results with the string returned in the `nextPageToken` field of the previous response.
          title: Page token
        in: query
      - name: pageSize
        schema:
          type: integer
          description: Number of results to return per page, with a maximum of 1000. Defaults to 50.
          title: Page size
        in: query
      operationId: listAccountTypes
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  properties:
                    entries:
                      type: array
                      items:
                        type: object
                        required:
                        - accountTypeId
                        - accountTypeName
                        - description
                        - isCustom
                        properties:
                          accountTypeId:
                            type: string
                            description: The unique identifier of the account type.
                          accountTypeName:
                            type: string
                            description: The name of the account type.
                          description:
                            type: string
                            description: A human-readable description of the permissions and capabilities provided by this account type.
                          isCustom:
                            type: boolean
                            description: Whether this is a custom account type created by the organization (true) or a default Sigma account type (false).
                      description: Array of results returned by the endpoint
                      title: Result entries
                - type: object
                  properties:
                    nextPageToken:
                      type: string
                      description: 'A string that can be passed to the `pageToken` parameter in the next request to fetch the next page of results. Not present in the last page of results.

                        **Must be treated as an opaque string.**'
                      title: Next page token
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - Account Types
      security:
      - oauth2: []
    post:
      summary: Create an account type
      description: 'Create a custom account type with specified permissions.


        ### Usage notes

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type.

        - Use the permission names from the /v2/accountTypes/:accountTypeId/permissions endpoint.


        ### Usage scenarios

        - Create custom account types to define specific permission sets for your organization''s users.'
      parameters: []
      operationId: createAccountType
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - permissions
              properties:
                name:
                  type: string
                  description: The name of the account type.
                description:
                  type: string
                  description: A description of the account type.
                permissions:
                  type: array
                  items:
                    type: string
                  description: An array of permissions to enable for this account type. Use the permission names from the [/v2/accountTypes/:accountTypeId/permissions](https://help.sigmacomputing.com/reference/list-account-type-permissions) endpoint.
      responses:
        '201':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - accountTypeId
                - accountTypeName
                - description
                - isCustom
                properties:
                  accountTypeId:
                    type: string
                    description: The unique identifier of the account type.
                  accountTypeName:
                    type: string
                    description: The name of the account type.
                  description:
                    type: string
                    description: A human-readable description of the permissions and capabilities provided by this account type.
                  isCustom:
                    type: boolean
                    description: Whether this is a custom account type created by the organization (true) or a default Sigma account type (false).
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - Account Types
      security:
      - oauth2: []
