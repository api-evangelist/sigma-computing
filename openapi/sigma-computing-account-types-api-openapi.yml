  /v2/accountTypes/{accountTypeId}/permissions:
    get:
      summary: List account type permissions
      description: 'Returns all feature permissions for a specific account type.


        ### Usage notes

        - Retrieve the **accountTypeId** by calling the /v2/accountTypes endpoint.

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type.


        ### Usage scenarios

        - Display permission details in an admin interface.

        - Validate user capabilities based on account type.

        - Compare permissions across different account types.'
      parameters:
      - name: accountTypeId
        schema:
          type: string
          description: The unique identifier of the account type.
        in: path
        required: true
      operationId: listAccountTypePermissions
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - permission
                  - description
                  properties:
                    permission:
                      type: string
                      description: The permission name. For example, "view-worksheet".
                    description:
                      type: string
                      description: A human-readable description of what this permission allows.
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - Account Types
      security:
      - oauth2: []
