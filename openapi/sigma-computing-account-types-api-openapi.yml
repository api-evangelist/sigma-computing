  /v2/accountTypes/{accountTypeId}:
    delete:
      summary: Delete an account type
      description: 'Delete a custom account type and reassign its users to another account type.


        ### Usage notes

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type.

        - Default Sigma account types cannot be deleted.

        - All users assigned to the deleted account type will be reassigned to the specified **reassignToAccountTypeId**.

        - Retrieve account type IDs by calling the /v2/accountTypes endpoint.


        ### Usage scenarios

        - Remove custom account types that are no longer needed.

        - Consolidate account types by moving users to a different account type before deletion.'
      parameters:
      - name: accountTypeId
        schema:
          type: string
          description: The unique identifier of the account type to delete.
        in: path
        required: true
      - name: reassignToAccountTypeId
        schema:
          type: string
          description: The unique identifier of the account type to reassign users to. Users currently assigned the deleted account type will be reassigned this account type.
        in: query
      operationId: deleteAccountType
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - Account Types
      security:
      - oauth2: []
