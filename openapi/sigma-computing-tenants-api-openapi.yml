  /v2/tenants/{tenantOrganizationId}/capabilities/deployments:batchRemove:
    post:
      summary: Remove deployment capabilities from a tenant
      description: 'Revoke a tenant organization''s capability to deploy to one or more tenant organizations.


        ### Usage notes

        - To perform this operation, you must use API credentials owned by a user assigned the Admin account type.

        - Retrieve **tenantOrganizationId** values by calling the [/v2/tenants](https://help.sigmacomputing.com/reference/list-tenants) endpoint.

        - Existing deployments from this tenant organization to the specified tenant organizations will be removed.'
      parameters:
      - name: tenantOrganizationId
        schema:
          type: string
          description: Unique identifier of the tenant organization whose deployment capabilities are being managed.
          title: Tenant Organization ID
        in: path
        required: true
      operationId: removeTenantDeploymentCapabilities
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              required:
              - deployToTenantOrganizationIds
              properties:
                deployToTenantOrganizationIds:
                  type: array
                  items:
                    type: string
                  description: The tenant organizations that this tenant can no longer deploy to
              description: Request parameters for removing tenant deployment capabilities
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - tenants
      security:
      - oauth2: []
    servers:
    - url: https://api.sigmacomputing.com
