  /v2/tenants/{tenantOrganizationId}/workbooks:
    get:
      summary: Get deployed workbook in tenant organization
      description: "Retrieve the workbook ID for a workbook deployed to a tenant organization for a given parent workbook and deployment policy.\n\n### Usage notes\n- To perform this operation, you must use API credentials owned by a user assigned the Admin account type.\n- The parent workbook must be part of the specified deployment policy.\n- The workbook must be deployed to the specified tenant organization.\n- Retrieve the **tenantOrganizationId** by calling the [/v2/tenants](https://help.sigmacomputing.com/reference/list-tenants) endpoint.\n- Retrieve the **deploymentPolicyId** by calling the [/v2/deploymentPolicies](https://help.sigmacomputing.com/reference/list-deployments) endpoint. \n- Retrieve the **parentWorkbookId** by calling the [/v2/deploymentPolicies/{deploymentPolicyId}/files](https://help.sigmacomputing.com/reference/list-inodes-for-deployment) endpoint and using the `workbookId` included in the response.\n- For version-tagged deployment policies, you may pass either the source workbook ID or the version-tagged workbook ID as the **parentWorkbookId**."
      parameters:
      - name: tenantOrganizationId
        schema:
          type: string
        in: path
        required: true
      - name: parentWorkbookId
        schema:
          type: string
          description: Unique identifier of the workbook in the parent organization. For version-tagged deployments, this can be either the source workbook ID or the version-tagged workbook ID.
        in: query
      - name: deploymentPolicyId
        schema:
          type: string
          description: The ID of the deployment policy that contains the workbook
        in: query
      operationId: getTenantWorkbook
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - workbookId
                - workbookUrl
                properties:
                  workbookId:
                    type: string
                    description: Unique identifier of the workbook deployed to the tenant organization
                  workbookUrl:
                    type: string
                    description: URL to access the workbook in the tenant organization
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
