      - name: apiConnectorId
        schema:
          type: string
        in: path
        required: true
      operationId: updateApiConnector
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New display name.
                description:
                  type:
                  - string
                  - 'null'
                  description: New description. Pass `null` to clear.
                params:
                  type: object
                  required:
                  - method
                  - url
                  - headers
                  - pathParams
                  - queryParams
                  - body
