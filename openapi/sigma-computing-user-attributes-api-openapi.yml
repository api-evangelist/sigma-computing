  /v2/user-attributes/{userAttributeId}/users:
    get:
      summary: Get users for a user attribute
      description: 'Get a list of users that have a specific user attribute defined, and the assigned value for the user attribute.


        ### Usage notes

        - Retrieve the **userAttributeId** by calling the /v2/user-attributes endpoint.'
      parameters:
      - name: userAttributeId
        schema:
          type: string
          description: Unique identifier of the user attribute.
        in: path
        required: true
      - name: page
