          description: Number of results to return per page, with a maximum of 1,000 per request. Use the `page` option in subsequent requests to retrieve the next set of results.
          title: Limit
        in: query
      operationId: getUserAttributeTenantAssignments
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  - nextPage
                  properties:
                    entries:
                      type: array
                      items:
                        allOf:
                        - type: object
                          required:
                          - tenantOrganizationId
                          - value
                          properties:
                            tenantOrganizationId:
                              type: string
                              description: Unique identifier of the tenant.
                            value:
                              type: object
                              required:
                              - type
                              - val
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - string
                                  description: Type of user attribute.
                                val:
                                  type: string
                                  description: Value of the user attribute.
                              description: Assigned value.
                        - type: object
                          required:
                          - createdBy
                          - updatedBy
                          - createdAt
                          - updatedAt
                          properties:
                            createdBy:
                              type: string
                              description: The identifier of the user who created this object.
                            updatedBy:
                              type: string
                              description: The identifier of the user or process that last updated this object.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the object was created.
                            updatedAt:
                              type: string
                              format: date-time
                              description: When the object was last updated.
                    nextPage:
                      type:
                      - string
                      - 'null'
                - type: object
                  properties:
                    total:
                      type: number
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - User Attributes
    patch:
      summary: Update a user attribute for tenants
      description: 'Update a user attribute for one or more tenants. Currently, this endpoint only supports deleting a user attribute assignment.


        ### Usage notes

        - Retrieve the **userAttributeId** by calling the /v2/user-attributes endpoint.

        - Specify one or more tenants by tenantOrganizationId. Retrieve the **tenantOrganizationId** by calling the /v2/tenants endpoint and using the `tenantOrganizationId` included in the response.'
      parameters:
      - name: userAttributeId
        schema:
          type: string
          description: Unique identifier of the user attribute.
        in: path
        required: true
      operationId: updateUserAttributeForTenants
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              required:
              - delete
              properties:
                delete:
                  type: array
                  items:
                    type: object
                    required:
                    - tenantOrganizationId
                    properties:
                      tenantOrganizationId:
                        type: string
                        description: The unique identifier of the tenant.
                  description: The tenants whose assignments are to be revoked.
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - User Attributes
    post:
      summary: Set a user attribute for tenants
      description: 'Assign and set the value of a specific user attribute for one or more tenants.


        ### Usage notes

        - Retrieve the **userAttributeId** by calling the /v2/user-attributes endpoint.

        - Specify one or more tenant by tenantOrganizationId. Retrieve the **tenantOrganizationId** by calling the /v2/tenants endpoint and using the `tenantOrganizationId` included in the response.'
      parameters:
      - name: userAttributeId
        schema:
          type: string
          description: Unique identifier of the user attribute.
        in: path
        required: true
      operationId: setUserAttributeForTenants
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              required:
              - assignments
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required:
                    - tenantOrganizationId
                    - value
                    properties:
                      tenantOrganizationId:
                        type: string
                        description: Unique identifier of the tenant.
                      value:
                        type: object
                        required:
                        - type
                        - val
                        properties:
                          type:
                            type: string
                            enum:
                            - string
                            description: Type of user attribute.
                          val:
                            type: string
                            description: Value of the user attribute.
                        description: The value of the user attribute
                        title: Attribute value
            examples:
              Request Example:
                value:
                  assignments:
                  - tenantOrganizationId: 00000000-0000-0000-0000-000000000000
                    value:
                      type: string
                      val: foo
                  - tenantOrganizationId: 00000000-0000-0000-0000-000000000001
                    value:
                      type: string
                      val: bar
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - User Attributes
  /v2/user-attributes/{userAttributeId}/tenants/{tenantOrganizationId}:
    delete:
      summary: Delete a user attribute for a tenant
      description: 'Delete a specific user attribute for a specific tenant.


        ### Usage notes

        - Retrieve the **userAttributeId** by calling the /v2/user-attributes endpoint.

        - Retrieve the **tenantOrganizationId** by calling the /v2/tenants endpoint and using the `tenantOrganizationId` included in the response.'
