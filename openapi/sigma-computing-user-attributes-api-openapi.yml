          title: Limit
        in: query
      operationId: getUserAttributeUserAssignments
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  - nextPage
                  properties:
                    entries:
                      type: array
                      items:
                        allOf:
                        - type: object
                          required:
                          - userId
                          - value
                          properties:
                            userId:
                              type: string
                              description: Unique identifier of the user.
                            value:
                              type: object
                              required:
                              - type
                              - val
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - string
                                  description: Type of user attribute.
                                val:
                                  type: string
                                  description: Value of the user attribute.
                              description: Assigned value.
                        - type: object
                          required:
                          - createdBy
                          - updatedBy
                          - createdAt
                          - updatedAt
                          properties:
                            createdBy:
                              type: string
                              description: The identifier of the user who created this object.
                            updatedBy:
                              type: string
                              description: The identifier of the user or process that last updated this object.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the object was created.
                            updatedAt:
                              type: string
                              format: date-time
                              description: When the object was last updated.
                    nextPage:
