                                  description: OAuth scopes.
                                accessTokenAuthMethod:
                                  type: string
                                  enum:
                                  - httpBasic
                                  - requestBody
                                  description: How client credentials are presented to the token endpoint.
                        description: ''
                        title: OAuth authorization code
