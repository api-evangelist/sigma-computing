security:
- oauth2: []
tags:
- name: API Credentials
paths:
  /v2/api-credentials:
    get:
      summary: List API credentials
      description: 'This endpoint returns a paginated list of API credentials. For more information on API credentials, see Configure API credentials and connectors in Sigma.


        ### Usage notes

        - The user making this request must be assigned an account type with the **Manage API connectors** permission enabled.

        - Only returns API credentials that the user making this request has at least **Can view** access to.

        - Secret fields such as passwords, tokens, and client secrets are never included in the response.

        - Use the `name` query parameter to filter by credential name.

        - Use the `orderBy` query parameter to set sort order.


        ### Usage scenarios

        - **Credential management:** View and audit the credentials used by API connectors in your Sigma organization.

        - **API connector creation:** Retrieve available credentials to present as options when creating an API connector.'
      parameters:
      - name: pageToken
        schema:
          type: string
          description: Use to specify the next set of results with the string returned in the `nextPageToken` field of the previous response.
          title: Page token
        in: query
      - name: pageSize
        schema:
          type: integer
          description: Number of results to return per page, with a maximum of 1000. Defaults to 50.
          title: Page size
        in: query
      - name: orderBy
        schema:
          type: string
          description: 'Sort order. Supported fields: `name`, `description`. Append ` desc` for descending (e.g. `name desc`). Defaults to `name` ascending.'
          title: Order by
        in: query
      - name: name
        schema:
          type: string
          description: Filter results to credentials whose name contains this substring.
        in: query
      operationId: listApiCredentials
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - entries
                  properties:
                    entries:
                      type: array
                      items:
                        allOf:
                        - type: object
                          required:
                          - apiCredentialId
                          - name
                          - authMethod
                          - allowlist
                          properties:
                            apiCredentialId:
                              type: string
                              description: Unique identifier of the API credential.
                            name:
                              type: string
                              description: Display name of the credential.
                            authMethod:
                              type: string
                              enum:
                              - basic
                              - bearer
                              - apiKey
                              - oAuthClientCredentials
                              - oAuthAuthorizationCode
                              - oAuthPasswordCredentials
                              - awsSigV4
                              description: Authentication method the credential uses.
                            allowlist:
                              type: array
                              items:
                                type: string
                              description: Hostname glob patterns the credential is authorized to be used against.
                        - type: object
                          properties:
                            description:
                              type: string
                              description: Human-readable description.
                      description: Array of results returned by the endpoint
                      title: Result entries
                - type: object
                  properties:
                    nextPageToken:
                      type: string
                      description: 'A string that can be passed to the `pageToken` parameter in the next request to fetch the next page of results. Not present in the last page of results.

                        **Must be treated as an opaque string.**'
                      title: Next page token
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - API Credentials
    post:
      summary: Create an API credential
      description: 'This endpoint creates a new API credential for use with API connectors and the **Call API** action in Sigma. For more information on API credentials, see Configure API credentials and connectors in Sigma.


        ### Usage notes

        - The user making this request must be assigned an account type with the **Manage API connectors** permission enabled.

        - The `allowlist` parameter is required and must contain at least one hostname glob pattern. Use `["*"]` to allow the credential to be used against any host.

        - The following authentication methods are supported: `basic`, `bearer`, `apiKey`, `oAuthClientCredentials`, `oAuthAuthorizationCode`, `oAuthPasswordCredentials`, `awsSigV4`.

        - Secret fields are encrypted at rest and are never returned in subsequent read responses.


        ### Usage scenarios

        - **Credential provisioning:** Automate credential creation as part of environment setup or onboarding.

        - **Multi-service authentication:** Create separate credentials for each external service, with allowlists scoped to only that service''s domains.'
      parameters: []
      operationId: createApiCredential
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - name
                - allowlist
                - credential
                properties:
                  name:
                    type: string
                    description: Display name of the credential.
                  allowlist:
                    type: array
                    items:
                      type: string
                    description: Hostname glob patterns the credential may be used against (e.g. `["*.example.com"]`). Required and must not be empty; use `["*"]` to allow every host.
                  credential:
                    oneOf:
                    - type: object
                      required:
                      - authMethod
                      - basic
                      properties:
                        authMethod:
                          type: string
                          enum:
                          - basic
                        basic:
                          type: object
                          required:
                          - username
                          - password
                          properties:
                            username:
                              type: string
                              description: Username for Basic authentication.
                            password:
                              type: string
                              description: Password for Basic authentication. Encrypted at rest; never returned in responses.
                      description: ''
                      title: Basic
                    - type: object
                      required:
                      - authMethod
                      - bearer
                      properties:
                        authMethod:
                          type: string
                          enum:
                          - bearer
                        bearer:
                          type: object
                          required:
                          - token
                          properties:
                            token:
                              type: string
                              description: Bearer token. Encrypted at rest; never returned in responses.
                      description: ''
                      title: Bearer
                    - type: object
                      required:
                      - authMethod
                      - apiKey
                      properties:
                        authMethod:
                          type: string
                          enum:
                          - apiKey
                        apiKey:
                          type: object
                          required:
                          - key
                          - value
                          - isQueryParam
                          properties:
                            key:
                              type: string
                              description: Header or query parameter name carrying the API key.
                            value:
                              type: string
                              description: API key value. Encrypted at rest; never returned in responses.
                            isQueryParam:
                              type: boolean
                              description: Whether the key is sent as a query parameter; if false, it is sent as a header.
                      description: ''
                      title: API key
                    - type: object
                      required:
                      - authMethod
                      - oAuthClientCredentials
                      properties:
                        authMethod:
                          type: string
                          enum:
                          - oAuthClientCredentials
                        oAuthClientCredentials:
                          type: object
                          required:
                          - clientId
                          - clientSecret
                          - accessTokenUrl
                          - scopes
                          - accessTokenAuthMethod
                          properties:
                            clientId:
                              type: string
                              description: OAuth client ID.
                            clientSecret:
                              type: string
                              description: OAuth client secret. Encrypted at rest; never returned in responses.
                            accessTokenUrl:
                              type: string
                              description: OAuth token endpoint URL.
                            scopes:
                              type: array
                              items:
                                type: string
                              description: OAuth scopes requested at token exchange.
                            accessTokenAuthMethod:
                              type: string
                              enum:
                              - httpBasic
                              - requestBody
                              description: How client credentials are presented to the token endpoint.
                      description: ''
                      title: OAuth client credentials
                    - type: object
                      required:
                      - authMethod
                      - awsSigV4
                      properties:
                        authMethod:
                          type: string
                          enum:
                          - awsSigV4
                        awsSigV4:
                          allOf:
                          - type: object
                            required:
                            - accessKeyId
                            - secretAccessKey
                            properties:
                              accessKeyId:
                                type: string
                                description: AWS access key ID.
                              secretAccessKey:
                                type: string
                                description: AWS secret access key. Encrypted at rest; never returned in responses.
                          - type: object
                            properties:
                              region:
                                type: string
                                description: AWS region for SigV4 signing.
                              service:
                                type: string
                                description: AWS service name for SigV4 signing (e.g. `s3`, `execute-api`).
                              sessionToken:
                                type: string
                                description: AWS STS session token for temporary credentials.
                              temporaryCredentialsUrl:
                                type: string
                                description: URL that vends temporary credentials (e.g. STS AssumeRole endpoint).
                              temporaryCredentialsResponseMapping:
                                type: object
                                properties:
                                  accessKeyField:
                                    type: string
                                  secretKeyField:
                                    type: string
                                  sessionTokenField:
                                    type: string
                                  expirationField:
                                    type: string
                              temporaryCredentialsRequestParams:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - key
                                  - value
                                  - sendIn
                                  properties:
                                    key:
                                      type: string
                                    value:
                                      type: string
                                    sendIn:
                                      type: string
                                      enum:
                                      - queryParam
                                      - body
                                      - header
                                description: 'Additional key/value parameters attached to the temporary-credentials swap request. Each entry specifies whether it is sent as a request header, body field, or query parameter (`sendIn`: `header` | `body` | `queryParam`). Use this when the swap endpoint requires its own authentication (for example, an `x-api-key` header).'
                      description: ''
                      title: AWS SigV4
              - type: object
                properties:
                  description:
                    type: string
                    description: Human-readable description.
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - apiCredentialId
                  - name
                  - authMethod
                  - allowlist
                  - credential
                  properties:
                    apiCredentialId:
                      type: string
                      description: Unique identifier of the API credential.
                    name:
                      type: string
                      description: Display name of the credential.
                    authMethod:
                      type: string
                      enum:
                      - basic
                      - bearer
                      - apiKey
                      - oAuthClientCredentials
                      - oAuthAuthorizationCode
                      - oAuthPasswordCredentials
                      - awsSigV4
                      description: Authentication method the credential uses.
                    allowlist:
                      type: array
                      items:
                        type: string
                      description: Hostname glob patterns (e.g. `*.example.com`) that the credential is authorized to be used against.
                    credential:
                      oneOf:
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - basic
                        - type: object
                          properties:
                            basic:
                              type: object
                              required:
                              - username
                              properties:
                                username:
                                  type: string
                                  description: Username for Basic authentication.
                        description: ''
                        title: Basic
                      - type: object
                        required:
                        - authMethod
                        properties:
                          authMethod:
                            type: string
                            enum:
                            - bearer
                        description: ''
                        title: Bearer
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - apiKey
                        - type: object
                          properties:
                            apiKey:
                              type: object
                              required:
                              - key
                              - isQueryParam
                              properties:
                                key:
                                  type: string
                                  description: Header or query parameter name carrying the API key.
                                isQueryParam:
                                  type: boolean
                                  description: Whether the key is sent as a query parameter; if false, it is sent as a header.
                        description: ''
                        title: API key
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - oAuthClientCredentials
                        - type: object
                          properties:
                            oAuthClientCredentials:
                              type: object
                              required:
                              - clientId
                              - accessTokenUrl
                              - scopes
                              - accessTokenAuthMethod
                              properties:
                                clientId:
                                  type: string
                                  description: OAuth client ID.
                                accessTokenUrl:
                                  type: string
                                  description: OAuth token endpoint URL.
                                scopes:
                                  type: array
                                  items:
                                    type: string
                                  description: OAuth scopes requested at token exchange.
                                accessTokenAuthMethod:
                                  type: string
                                  enum:
                                  - httpBasic
                                  - requestBody
                                  description: How client credentials are presented to the token endpoint.
                        description: ''
                        title: OAuth client credentials
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - oAuthAuthorizationCode
                        - type: object
                          properties:
                            oAuthAuthorizationCode:
                              type: object
                              required:
                              - clientId
                              - authorizationUrl
                              - accessTokenUrl
                              - scopes
                              - accessTokenAuthMethod
                              properties:
                                clientId:
                                  type: string
                                  description: OAuth client ID.
                                authorizationUrl:
                                  type: string
                                  description: OAuth authorization endpoint URL.
                                accessTokenUrl:
                                  type: string
                                  description: OAuth token endpoint URL.
                                scopes:
                                  type: array
                                  items:
                                    type: string
                                  description: OAuth scopes.
                                accessTokenAuthMethod:
                                  type: string
                                  enum:
                                  - httpBasic
                                  - requestBody
                                  description: How client credentials are presented to the token endpoint.
                        description: ''
                        title: OAuth authorization code
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - oAuthPasswordCredentials
                        - type: object
                          properties:
                            oAuthPasswordCredentials:
                              allOf:
                              - type: object
                                required:
                                - username
                                - accessTokenUrl
                                - scopes
                                - accessTokenAuthMethod
                                properties:
                                  username:
                                    type: string
                                    description: OAuth resource-owner username.
                                  accessTokenUrl:
                                    type: string
                                    description: OAuth token endpoint URL.
                                  scopes:
                                    type: array
                                    items:
                                      type: string
                                    description: OAuth scopes.
                                  accessTokenAuthMethod:
                                    type: string
                                    enum:
                                    - httpBasic
                                    - requestBody
                                    description: How client credentials are presented to the token endpoint.
                              - type: object
                                properties:
                                  clientId:
                                    type: string
                                    description: OAuth client ID.
                        description: ''
                        title: OAuth password credentials
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - awsSigV4
                        - type: object
                          properties:
                            awsSigV4:
                              allOf:
