      - name: apiCredentialId
        schema:
          type: string
        in: path
        required: true
      operationId: updateApiCredential
      requestBody:
        description: The request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New display name.
                description:
                  type:
                  - string
                  - 'null'
                  description: New description. Pass `null` to clear.
                allowlist:
                  type: array
                  items:
                    type: string
                  description: Replacement list of hostname glob patterns. Must not be empty; use `["*"]` to allow every host.
                credential:
                  oneOf:
                  - type: object
                    required:
                    - authMethod
                    - basic
                    properties:
                      authMethod:
                        type: string
                        enum:
                        - basic
                      basic:
                        type: object
                        required:
                        - username
                        - password
                        properties:
                          username:
                            type: string
                            description: Username for Basic authentication.
                          password:
                            type: string
                            description: Password for Basic authentication. Encrypted at rest; never returned in responses.
                    description: ''
                    title: Basic
                  - type: object
                    required:
                    - authMethod
                    - bearer
                    properties:
                      authMethod:
                        type: string
                        enum:
                        - bearer
                      bearer:
                        type: object
                        required:
                        - token
                        properties:
                          token:
                            type: string
                            description: Bearer token. Encrypted at rest; never returned in responses.
                    description: ''
                    title: Bearer
                  - type: object
                    required:
                    - authMethod
                    - apiKey
                    properties:
                      authMethod:
                        type: string
                        enum:
                        - apiKey
                      apiKey:
                        type: object
                        required:
                        - key
                        - value
                        - isQueryParam
                        properties:
                          key:
                            type: string
                            description: Header or query parameter name carrying the API key.
                          value:
                            type: string
                            description: API key value. Encrypted at rest; never returned in responses.
                          isQueryParam:
                            type: boolean
                            description: Whether the key is sent as a query parameter; if false, it is sent as a header.
                    description: ''
                    title: API key
                  - type: object
                    required:
                    - authMethod
                    - oAuthClientCredentials
                    properties:
                      authMethod:
                        type: string
                        enum:
                        - oAuthClientCredentials
                      oAuthClientCredentials:
                        type: object
                        required:
                        - clientId
                        - clientSecret
                        - accessTokenUrl
                        - scopes
                        - accessTokenAuthMethod
                        properties:
                          clientId:
                            type: string
                            description: OAuth client ID.
                          clientSecret:
                            type: string
                            description: OAuth client secret. Encrypted at rest; never returned in responses.
                          accessTokenUrl:
                            type: string
                            description: OAuth token endpoint URL.
                          scopes:
                            type: array
                            items:
                              type: string
                            description: OAuth scopes requested at token exchange.
                          accessTokenAuthMethod:
                            type: string
                            enum:
                            - httpBasic
                            - requestBody
                            description: How client credentials are presented to the token endpoint.
                    description: ''
                    title: OAuth client credentials
                  - type: object
                    required:
                    - authMethod
                    - awsSigV4
                    properties:
                      authMethod:
                        type: string
                        enum:
                        - awsSigV4
                      awsSigV4:
                        allOf:
                        - type: object
                          required:
                          - accessKeyId
                          - secretAccessKey
                          properties:
                            accessKeyId:
                              type: string
                              description: AWS access key ID.
                            secretAccessKey:
                              type: string
                              description: AWS secret access key. Encrypted at rest; never returned in responses.
                        - type: object
                          properties:
                            region:
                              type: string
                              description: AWS region for SigV4 signing.
                            service:
                              type: string
                              description: AWS service name for SigV4 signing (e.g. `s3`, `execute-api`).
                            sessionToken:
                              type: string
                              description: AWS STS session token for temporary credentials.
                            temporaryCredentialsUrl:
                              type: string
                              description: URL that vends temporary credentials (e.g. STS AssumeRole endpoint).
                            temporaryCredentialsResponseMapping:
                              type: object
                              properties:
                                accessKeyField:
                                  type: string
                                secretKeyField:
                                  type: string
                                sessionTokenField:
                                  type: string
                                expirationField:
                                  type: string
                            temporaryCredentialsRequestParams:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - value
                                - sendIn
                                properties:
                                  key:
                                    type: string
                                  value:
                                    type: string
                                  sendIn:
                                    type: string
                                    enum:
                                    - queryParam
                                    - body
                                    - header
                              description: 'Additional key/value parameters attached to the temporary-credentials swap request. Each entry specifies whether it is sent as a request header, body field, or query parameter (`sendIn`: `header` | `body` | `queryParam`). Use this when the swap endpoint requires its own authentication (for example, an `x-api-key` header).'
                    description: ''
                    title: AWS SigV4
