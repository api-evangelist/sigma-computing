                    updatedBy:
                      type: string
                      description: The identifier of the user or process that last updated this object.
                    createdAt:
                      type: string
                      format: date-time
                      description: When the object was created.
                    updatedAt:
                      type: string
                      format: date-time
                      description: When the object was last updated.
                - type: object
                  properties:
                    description:
                      type: string
                      description: Human-readable description.
        default:
          $ref: '#/components/responses/ApiError'
      externalDocs:
        url: ''
        description: 'Sigma API documentation:'
      tags:
      - api-credentials
  /v2/api-credentials/{apiCredentialId}:
    get:
      summary: Get an API credential
      description: 'This endpoint returns nonsensitive details for a single API credential. For more information on API credentials, see [Configure API credentials and connectors in Sigma](https://help.sigmacomputing.com/docs/configure-api-credentials-and-connectors-in-sigma).


        ### Usage notes

        - The user making this request must be assigned an account type with the **Manage API connectors** permission enabled and have at least **Can view** access on the credential.

        - Retrieve the **apiCredentialId** by calling the [/v2/api-credentials](https://help.sigmacomputing.com/reference/list-api-credentials) endpoint.

        - Secret fields (passwords, tokens, client secrets, secret access keys) are never returned.


        ### Usage scenarios

        - **Credential inspection:** Retrieve the configuration of a credential to verify its settings before using it with a connector.'
      parameters:
      - name: apiCredentialId
        schema:
          type: string
        in: path
        required: true
      operationId: getApiCredential
      responses:
        '200':
          description: The response body.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - apiCredentialId
                  - name
                  - authMethod
                  - allowlist
                  - credential
                  properties:
                    apiCredentialId:
                      type: string
                      description: Unique identifier of the API credential.
                    name:
                      type: string
                      description: Display name of the credential.
                    authMethod:
                      type: string
                      enum:
                      - basic
                      - bearer
                      - apiKey
                      - oAuthClientCredentials
                      - oAuthAuthorizationCode
                      - oAuthPasswordCredentials
                      - awsSigV4
                      description: Authentication method the credential uses.
                    allowlist:
                      type: array
                      items:
                        type: string
                      description: Hostname glob patterns (e.g. `*.example.com`) that the credential is authorized to be used against.
                    credential:
                      oneOf:
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - basic
                        - type: object
                          properties:
                            basic:
                              type: object
                              required:
                              - username
                              properties:
                                username:
                                  type: string
                                  description: Username for Basic authentication.
                        description: ''
                        title: Basic
                      - type: object
                        required:
                        - authMethod
                        properties:
                          authMethod:
                            type: string
                            enum:
                            - bearer
                        description: ''
                        title: Bearer
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - apiKey
                        - type: object
                          properties:
                            apiKey:
                              type: object
                              required:
                              - key
                              - isQueryParam
                              properties:
                                key:
                                  type: string
                                  description: Header or query parameter name carrying the API key.
                                isQueryParam:
                                  type: boolean
                                  description: Whether the key is sent as a query parameter; if false, it is sent as a header.
                        description: ''
                        title: API key
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - oAuthClientCredentials
                        - type: object
                          properties:
                            oAuthClientCredentials:
                              type: object
                              required:
                              - clientId
                              - accessTokenUrl
                              - scopes
                              - accessTokenAuthMethod
                              properties:
                                clientId:
                                  type: string
                                  description: OAuth client ID.
                                accessTokenUrl:
                                  type: string
                                  description: OAuth token endpoint URL.
                                scopes:
                                  type: array
                                  items:
                                    type: string
                                  description: OAuth scopes requested at token exchange.
                                accessTokenAuthMethod:
                                  type: string
                                  enum:
                                  - httpBasic
                                  - requestBody
                                  description: How client credentials are presented to the token endpoint.
                        description: ''
                        title: OAuth client credentials
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
                              - oAuthAuthorizationCode
                        - type: object
                          properties:
                            oAuthAuthorizationCode:
                              type: object
                              required:
                              - clientId
                              - authorizationUrl
                              - accessTokenUrl
                              - scopes
                              - accessTokenAuthMethod
                              properties:
                                clientId:
                                  type: string
                                  description: OAuth client ID.
                                authorizationUrl:
                                  type: string
                                  description: OAuth authorization endpoint URL.
                                accessTokenUrl:
                                  type: string
                                  description: OAuth token endpoint URL.
                                scopes:
                                  type: array
                                  items:
                                    type: string
                                  description: OAuth scopes.
                                accessTokenAuthMethod:
                                  type: string
                                  enum:
                                  - httpBasic
                                  - requestBody
                                  description: How client credentials are presented to the token endpoint.
                        description: ''
                        title: OAuth authorization code
                      - allOf:
                        - type: object
                          required:
                          - authMethod
                          properties:
                            authMethod:
                              type: string
                              enum:
