- id: scim
  conforms: false
  evidence: No SCIM schema URNs and no /scim/v2 surface in the contract. User and group provisioning is done through the
    native /v2/members and /v2/teams endpoints rather than the standard. For a BI platform selling into enterprise IT this
    is the most conspicuous domain-standard absence — a buyer with an IdP-driven provisioning estate needs a bespoke connector.
- id: odata
  conforms: false
  evidence: No $metadata surface and no OData query options. Not expected for this API style.
domain_standard_conformance:
  market: Business intelligence / analytics on cloud data warehouses
  declared_in_contract: false
  assessment: 'No domain interchange standard is declared by the contract. The BI/analytics market has no widely adopted
    machine-readable API standard of the kind SCIM is for provisioning or FHIR is for health — the closest analogues are
    vendor semantic-layer formats. Sigma instead publishes its OWN code representation (openapi/sigma-computing-code-representation-openapi.yaml)
    as the interchange format for workbooks and data models, which is a proprietary schema rather than an industry one.
    REWARD-ONLY dimension: recorded as not applicable rather than as a failure.'
  adjacent_ecosystem_bindings:
  - name: dbt
    evidence: GET /v2/connections/{connectionId}/dbtArtifacts — Sigma consumes dbt artifacts (manifest/catalog) from a connection,
      binding to the dbt semantic layer as a de-facto ecosystem standard.
    operationId_note: Confirmed present in the published spec.
  - name: Snowflake / Databricks query tagging
    evidence: MCP-issued queries carry a "kind":"mcp" query tag so warehouse cost can be attributed per Snowflake QUERY_TAG
      and Databricks query tags conventions.
