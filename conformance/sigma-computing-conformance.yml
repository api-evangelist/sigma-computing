  evidence: No Idempotency-Key header in the spec or the docs (0 occurrences across 286 operations). See conventions/sigma-computing-conventions.yml.
- id: pagination
  conforms: true
  partial: true
  evidence: 'Two idioms coexist: offset (page + limit, 61 operations) and cursor (pageToken + pageSize, 26 operations).
