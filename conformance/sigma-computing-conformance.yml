    operationId and tag.'
- id: oauth2
  conforms: true
  evidence: 'REST API: clientCredentials flow declared in components.securitySchemes with tokenUrl /v2/auth/token. MCP:
    authorization_code + refresh_token with PKCE S256, advertised at /.well-known/oauth-authorization-server on every regional
    API host.'
- id: rfc8414
  conforms: true
  title: OAuth 2.0 Authorization Server Metadata
  evidence: https://api.sigmacomputing.com/.well-known/oauth-authorization-server returns 200 with issuer, authorization_endpoint,
    token_endpoint, registration_endpoint, scopes_supported, response_types_supported, grant_types_supported, code_challenge_methods_supported,
    token_endpoint_auth_methods_supported.
- id: rfc9728
  conforms: true
  title: OAuth 2.0 Protected Resource Metadata
  evidence: 'https://api.sigmacomputing.com/.well-known/oauth-protected-resource returns 200 naming resource https://api.sigmacomputing.com/mcp,
    and the MCP endpoint returns a conformant WWW-Authenticate: Bearer resource_metadata="..." scope="mcp:access" challenge
    on an unauthenticated POST.'
- id: rfc7591
  conforms: true
  title: OAuth 2.0 Dynamic Client Registration
  evidence: registration_endpoint https://api.sigmacomputing.com/mcp/register advertised in the authorization-server metadata.
- id: rfc7636
  conforms: true
  title: PKCE
  evidence: 'code_challenge_methods_supported: ["S256"].'
- id: rfc9727
  conforms: true
  title: API Catalog (/.well-known/api-catalog)
  evidence: https://help.sigmacomputing.com/.well-known/api-catalog returns 200 with Content-Type application/linkset+json;
    profile="https://www.rfc-editor.org/info/rfc9727", carrying two service-desc entries pointing at real, fetchable OpenAPI
