mcp_only:
- tool: query (natural language over governed data)
  reason: No REST equivalent. There is no endpoint that accepts a question, resolves it against a data model, generates
    SQL and returns an answer. This capability exists only through MCP and through Sigma Assistant in the product UI.
- tool: cross-resource search
  reason: REST listing endpoints are per-resource-type. A single query spanning workbooks, data models, reports and warehouse
    tables has no REST operation.
